<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>questail-collie 데모</title>
<style>
  :root { color-scheme: light; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #fafafa; color: #1a1a1a; margin: 0; }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  form { display: flex; gap: 8px; margin-bottom: 8px; }
  input[type="text"] { flex: 1; padding: 10px 12px; font-size: 15px; border: 1px solid #999; border-radius: 6px; background: #fff; color: inherit; }
  button { padding: 10px 18px; font-size: 15px; border: 1px solid #333; border-radius: 6px; background: #1a1a1a; color: #fff; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: wait; }
  #meta { font-size: 13px; color: #555; margin: 12px 0 20px; }
  section { border: 1px solid #ccc; border-radius: 8px; background: #fff; padding: 14px 16px; margin-bottom: 12px; }
  section h2 { font-size: 14px; margin: 0 0 8px; color: #555; font-weight: 600; }
  #answer { white-space: pre-wrap; font-size: 15px; line-height: 1.6; }
  #tools { margin: 0; padding-left: 20px; font-size: 14px; }
  #evidence article { border-top: 1px solid #e0e0e0; padding: 8px 0; font-size: 14px; }
  #evidence article:first-of-type { border-top: none; }
  #evidence .eid { font-family: monospace; font-size: 12px; color: #555; }
  #evidence .etext { white-space: pre-wrap; margin: 4px 0 0; line-height: 1.5; }
  #verify .pass { font-weight: 700; }
  #verify .pass.ok { color: #0a6b1a; }
  #verify .pass.fail { color: #a31212; }
  #verify ul { margin: 8px 0 0; padding-left: 20px; font-size: 14px; }
  #error { color: #a31212; font-size: 14px; margin-bottom: 12px; }
  .empty { color: #888; font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>questail-collie 데모</h1>
  <form id="ask-form">
    <input id="question" type="text" placeholder="게임 라이브러리에 대해 물어보세요" autocomplete="off" />
    <button id="send" type="submit">전송</button>
  </form>
  <div id="error" hidden></div>
  <div id="meta" hidden></div>

  <section aria-label="답변">
    <h2>(1) 답변</h2>
    <div id="answer" class="empty">질문을 입력하고 전송을 누르세요.</div>
  </section>

  <section aria-label="호출한 도구">
    <h2>(2) 호출한 도구</h2>
    <ul id="tools"><li class="empty">—</li></ul>
  </section>

  <section aria-label="근거">
    <h2>(3) 근거로 쓴 문서 부분</h2>
    <div id="evidence"><p class="empty">—</p></div>
  </section>

  <section aria-label="검증 결과">
    <h2>(4) 검증 결과</h2>
    <div id="verify"><p class="empty">—</p></div>
  </section>
</main>
<script>
(function () {
  "use strict";
  var form = document.getElementById("ask-form");
  var input = document.getElementById("question");
  var sendBtn = document.getElementById("send");
  var errorBox = document.getElementById("error");
  var metaBox = document.getElementById("meta");
  var answerBox = document.getElementById("answer");
  var toolsBox = document.getElementById("tools");
  var evidenceBox = document.getElementById("evidence");
  var verifyBox = document.getElementById("verify");

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  }

  function showError(msg) {
    errorBox.hidden = false;
    errorBox.textContent = msg;
  }

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var q = input.value.trim();
    if (!q) return;
    errorBox.hidden = true;
    sendBtn.disabled = true;
    answerBox.textContent = "답변 생성 중…";
    answerBox.classList.remove("empty");

    fetch("/api/ask", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ question: q })
    }).then(function (res) {
      return res.json().then(function (data) {
        return { status: res.status, data: data };
      });
    }).then(function (out) {
      sendBtn.disabled = false;
      if (out.status !== 200) {
        showError(out.data && out.data.error ? out.data.error : "요청 실패 (HTTP " + out.status + ")");
        return;
      }
      var r = out.data;

      // 분류 결과 + 이관 여부
      metaBox.hidden = false;
      metaBox.textContent = "category: " + r.category + " · confidence: " + r.confidence +
        " · escalated: " + (r.escalated ? "예" : "아니오");

      // (1) 답변
      answerBox.textContent = r.answer || "(빈 답변)";

      // (2) 호출한 도구 목록
      toolsBox.innerHTML = (r.toolsUsed && r.toolsUsed.length)
        ? r.toolsUsed.map(function (t) { return "<li><code>" + esc(t) + "</code></li>"; }).join("")
        : "<li>호출한 도구 없음</li>";

      // (3) 근거 문서 부분
      var evList = r.evidence && r.evidence.length ? r.evidence : null;
      if (evList) {
        evidenceBox.innerHTML = evList.map(function (e) {
          return "<article><div class=\"eid\">" + esc(e.id) + " · " + esc(e.heading || "") + "</div>" +
            "<p class=\"etext\">" + esc(e.text || "") + "</p></article>";
        }).join("");
      } else {
        var ids = (r.evidenceIds && r.evidenceIds.length) ? r.evidenceIds.join(", ") : "없음";
        evidenceBox.innerHTML = "<p class=\"empty\">텍스트 미수신 — evidenceIds: " + esc(ids) + "</p>";
      }

      // (4) 검증 결과
      var v = r.verify || {};
      var passed = v.passed === true;
      var html = "<p class=\"pass " + (passed ? "ok" : "fail") + "\">" +
        (passed ? "통과" : "실패") + "</p>";
      if (v.violations && v.violations.length) {
        html += "<ul>" + v.violations.map(function (x) {
          return "<li><code>" + esc(x.rule) + "</code> — " + esc(x.detail) + "</li>";
        }).join("") + "</ul>";
      } else {
        html += "<p class=\"empty\">위반 없음</p>";
      }
      verifyBox.innerHTML = html;
    }).catch(function (err) {
      sendBtn.disabled = false;
      showError("요청 실패: " + err.message);
    });
  });
})();
</script>
</body>
</html>
